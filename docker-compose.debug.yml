services:
  pokerkit-open-spiel:
    environment:
      POKERSPIEL_SOLVER: external
      POKERSPIEL_PRESET: hulh-preflop
      POKERSPIEL_RANGE_SAMPLES: "1326"
      POKERSPIEL_POSTFLOP_SAMPLES: "32"
      POKERSPIEL_STABILITY_THRESHOLD: "0.98"
      POKERSPIEL_STOP_THRESHOLD: "0.85"
      POKERSPIEL_STOP_PATIENCE: "1"
      POKERSPIEL_ITERATIONS: "10000"
      POKERSPIEL_MAX_ITERATIONS: "10000"
      POKERSPIEL_MIN_ITERATIONS: "1000"
      POKERSPIEL_CHECKPOINT_EVERY: "1000"
      POKERSPIEL_MEMORY_THRESHOLD: "0.85"
      POKERSPIEL_OUTPUT_JSON: ./app/data/debug/report.json
